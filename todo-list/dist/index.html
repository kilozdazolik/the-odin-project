<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskMaster</title>
  <script defer src="main.js"></script></head>
  <body>
    <div class="container">
      <nav class="user-nav">
        <div class="left-section">
          <div class="logo">
            <svg class="logo__icon">
              <use xlink:href="img/sprite.svg#icon-database"></use>
            </svg>
            <p class="logo__text">TaskMaster</p>
          </div>
          <ul class="user-nav-items">
            <li class="user-nav__item"><a href="#">My Tasks</a></li>
            <li class="user-nav__item"><a href="#">Projects</a></li>
          </ul>
        </div>
        <div class="right-section">
          <div class="user-widgets">
            <button class="notification__button">
              <svg class="notification__icon">
                <use xlink:href="img/sprite.svg#icon-bell"></use>
              </svg>
            </button>

            <div class="user-widgets__user">
              <img
                src="img/avatar.jpg"
                alt="User photo"
                class="user-widgets__user-photo"
              />
            </div>
          </div>
        </div>
      </nav>
      <section class="section-project">
        <div class="header">
          <h1 class="page-title">My Projects</h1>
          <button class="page__button">New Project</button>
        </div>
        <div class="projects">
          <div class="project">
            <div class="project-icon">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24px"
                height="24px"
                fill="currentColor"
                viewBox="0 0 256 256"
              >
                <path
                  d="M216,72H131.31L104,44.69A15.86,15.86,0,0,0,92.69,40H40A16,16,0,0,0,24,56V200.62A15.4,15.4,0,0,0,39.38,216H216.89A15.13,15.13,0,0,0,232,200.89V88A16,16,0,0,0,216,72ZM40,56H92.69l16,16H40ZM216,200H40V88H216Z"
                ></path>
              </svg>
            </div>
            <div class="project-details">
              <div class="project-title">Home Renovation</div>
              <div class="project-count">12 tasks</div>
            </div>
          </div>

          <div class="project">
            <div class="project-icon">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24px"
                height="24px"
                fill="currentColor"
                viewBox="0 0 256 256"
              >
                <path
                  d="M216,72H131.31L104,44.69A15.86,15.86,0,0,0,92.69,40H40A16,16,0,0,0,24,56V200.62A15.4,15.4,0,0,0,39.38,216H216.89A15.13,15.13,0,0,0,232,200.89V88A16,16,0,0,0,216,72ZM40,56H92.69l16,16H40ZM216,200H40V88H216Z"
                ></path>
              </svg>
            </div>
            <div class="project-details">
              <div class="project-title">Home Renovation</div>
              <div class="project-count">12 tasks</div>
            </div>
          </div>

          <div class="project">
            <div class="project-icon">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24px"
                height="24px"
                fill="currentColor"
                viewBox="0 0 256 256"
              >
                <path
                  d="M216,72H131.31L104,44.69A15.86,15.86,0,0,0,92.69,40H40A16,16,0,0,0,24,56V200.62A15.4,15.4,0,0,0,39.38,216H216.89A15.13,15.13,0,0,0,232,200.89V88A16,16,0,0,0,216,72ZM40,56H92.69l16,16H40ZM216,200H40V88H216Z"
                ></path>
              </svg>
            </div>
            <div class="project-details">
              <div class="project-title">Home Renovation</div>
              <div class="project-count">12 tasks</div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
