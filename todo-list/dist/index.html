<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>TaskMaster</title>
  <script defer src="main.js"></script></head>
  <body>
    <div class="container">
      <div class="header">
        <div class="logo">
          <svg class="logo__icon">
            <use xlink:href="img/sprite.svg#icon-text-document-inverted"></use>
          </svg>
          <p class="logo-text">TaskMaster</p>
        </div>

        <nav class="user-nav">
          <div class="user-nav-links">
            <ul class="nav-links">
              <li class="nav-links__item">
                <a href="#" class="nav-links__link">My Tasks</a>
              </li>
              <li class="nav-links__item">
                <a href="#" class="nav-links__link">Projects</a>
              </li>
            </ul>
          </div>
          <div class="user-nav-profile">
            <form action="#" class="search">
              <input type="text" class="search__input" placeholder="Search" />
              <button class="search__button">
                <svg class="search__icon">
                  <use
                    xlink:href="img/sprite.svg#icon-magnifyiSelection-10ng-glass"
                  ></use>
                </svg>
              </button>
            </form>
            <div class="user-nav__icon-box">
              <svg class="user-nav__icon">
                <use xlink:href="img/sprite.svg#icon-bell"></use>
              </svg>
            </div>
            <div class="user-nav__user">
              <img
                src="img/user.jpg"
                alt="User photo"
                class="user-nav__user-photo"
              />
            </div>
          </div>
        </nav>
      </div>
    </div>
  </body>
</html>
